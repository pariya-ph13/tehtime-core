<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendar</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: .5rem; }
    .cell { padding: .5rem; border: 1px solid #e5e7eb; border-radius: .375rem; text-align: center; }
    .muted { color: #9ca3af; }
    header { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }
    a.button { padding: .25rem .5rem; border: 1px solid #e5e7eb; border-radius: .375rem; text-decoration: none; color: #111827; }
    .controls { margin-left: auto; display: flex; gap: .5rem; }
  </style>
</head>
<body>
  {{ embed }}
</body>
</html>
